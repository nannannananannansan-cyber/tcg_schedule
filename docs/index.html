<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCG Schedule</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="container">
      <h1>TCG Schedule</h1>
      <p>大阪のカードゲーム大会スケジュール</p>
    </div>
  </header>

  <div class="controls">
    <div class="container">

      <div class="filter-row">
        <span class="filter-label">ゲーム</span>

        <div class="filters" id="game-filters">
          <button class="filter active" data-game="all">
            すべて
          </button>

          <button class="filter" data-game="pokemon">
            ポケモン
          </button>

          <button class="filter" data-game="lorcana">
            ロルカナ
          </button>
        </div>
      </div>

      <div class="filter-row">
        <label class="filter-label" for="area-filter">
          エリア
        </label>

        <select id="area-filter" class="area-select">
          <option value="all">すべて</option>

          <optgroup label="主要エリア">
            <option value="namba">
              なんば・日本橋
            </option>

            <option value="shinsaibashi">
              心斎橋
            </option>

            <option value="umeda">
              梅田
            </option>

            <option value="tennoji">
              天王寺・阿倍野
            </option>
          </optgroup>

          <optgroup label="その他">
            <option value="osaka-city-other">
              大阪市その他
            </option>

            <option value="sakai">
              堺
            </option>

            <option value="higashiosaka-yao">
              東大阪・八尾
            </option>

            <option value="hokusetsu">
              北摂
            </option>

            <option value="osaka-other">
              その他大阪府
            </option>
          </optgroup>
        </select>
      </div>

      <div class="filter-row">
        <label class="filter-label" for="keyword-filter">
          検索
        </label>

        <input
          id="keyword-filter"
          class="keyword-input"
          type="search"
          placeholder="店舗名・大会名・住所"
          autocomplete="off"
        >
      </div>

      <div id="date-nav" class="date-nav"></div>

    </div>
  </div>

  <main class="container">
    <div id="summary"></div>

    <div id="events">
      読み込み中...
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
